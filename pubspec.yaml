name: mobile_iot
description: "MineGuard Platform — Mobile Operator Interface"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP client — chosen for first-class interceptor support
  dio: ^5.7.0

  # Secure JWT storage using OS keychain / Android Keystore
  flutter_secure_storage: ^9.2.2

  # Compile-safe dependency injection without BuildContext coupling
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
