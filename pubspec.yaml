name: mobile_iot
description: "MineGuard Platform — Mobile Operator Interface"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP client — chosen for first-class interceptor support
  dio: ^5.7.0

  # Secure JWT storage using OS keychain / Android Keystore
  flutter_secure_storage: ^9.2.2

  # State management (Bloc) and DI (get_it) — BuildContext-free, testable
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  get_it: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
